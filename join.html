<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Siege: you're invited</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#1e140c;color:#ecdcb4;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}</style>
</head>
<body>
<p>Opening Daily Siege… <a id="go" href="/">Continue</a></p>
<script>
  // Invite links look like /join/<code>. Hand the code to the game's front page.
  var m = location.pathname.match(/\/join\/([A-Za-z0-9_-]{8,64})\/?$/), to = "/" + (m ? "?join=" + m[1] : "");
  document.getElementById("go").href = to; location.replace(to);
</script>
</body>
</html>
