name: CI

# Runs on pull requests only. A merge to main is not tested a second time here: the Deploy workflow
# runs lint, the tests and the rules tests before it ships, so this saves Actions minutes.
on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Golden determinism tests
        run: npm test
      - run: npm run build

  # The phone self-test page, run in three real browser engines. WebKit is the engine iPhones use,
  # so this catches a device fighting a battle differently before a player ever sees it.
  #
  # It runs inside Microsoft's Playwright image, which already holds all three browsers and every
  # system library they need, so nothing is downloaded from Ubuntu's package servers. Its version
  # must match the "playwright" version pinned in package.json: bump the two together.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Self-test in Chromium, Firefox and WebKit
        run: node tools/selftest-browsers.mjs chromium firefox webkit

  # The hosted game against the Firebase emulators: the security rules; three accounts in real browsers
  # registering, sealing orders, failing to read each other's secrets and getting a server-fought battle;
  # then a full seven-day war fought by the server and replayed in a browser.
  #
  # Chromium and the emulators are kept in the Actions cache, so they are downloaded once per version,
  # not on every run. Chromium's system libraries already come with the GitHub runner.
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Versions for the cache keys
        id: v
        run: |
          echo "playwright=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "firebase=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ steps.v.outputs.firebase }}
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.v.outputs.playwright }}
      - name: Security rules
        run: npm run test:rules
      - name: Download Chromium (only when the cache missed)
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Three accounts, end to end
        run: npm run test:e2e
      - name: A seven-day war fought by the server
        run: npm run test:war
