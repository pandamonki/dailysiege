name: Deploy

# Every push to main goes live: the game (Hosting), the security rules and the server functions.
# It runs the same tests as CI first and deploys only if they pass.
on:
  push:
    branches: [main]
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT: daily-siege
  # the service-account key added to the repository's secrets (any of these names is accepted)
  SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAILY_SIEGE || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy key is present
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::No Firebase service-account secret found. Add it under Settings > Secrets and variables > Actions as FIREBASE_SERVICE_ACCOUNT_DAILY_SIEGE."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.SERVICE_ACCOUNT }}
      - name: Deploy the game, the rules and the server functions
        run: npx firebase deploy --only hosting,firestore,functions --project "$PROJECT" --non-interactive --force
      - name: Keep old function images from piling up (they cost storage)
        continue-on-error: true
        run: |
          npx firebase functions:artifacts:setpolicy --project "$PROJECT" --location australia-southeast1 --days 3 --force
          npx firebase functions:artifacts:setpolicy --project "$PROJECT" --location australia-southeast2 --days 3 --force
